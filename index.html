<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Queue & Score Pro</title>
    <!-- ดึงฟอนต์ตัวเลขสวยๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f7;
            overflow: hidden;
            position: relative;
        }

        /* ปุ่มวงกลมใสๆ ลอยขวาบน สำหรับกดดูตารางอันดับมือโปร */
        .floating-rank-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.1s, background 0.2s;
        }

        .floating-rank-btn:hover {
            background: rgba(255, 255, 255, 0.85);
        }

        .floating-rank-btn:active {
            transform: scale(0.92);
        }

        /* ป้ายแจ้งเตือน DEUCE เด้งขึ้นกลางจอแล้วจางหาย */
        .deuce-toast {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .deuce-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* พื้นที่แบ่งครึ่งจอ */
        .team-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .team-1 {
            background-color: #e3f2fd;
            color: #222;
            border-bottom: 2px solid rgba(255,255,255,0.5);
        }

        .team-2 {
            background-color: #fbe9e7;
            color: #222;
        }

        .team-title-input {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
            color: inherit;
            text-transform: uppercase;
            border: none;
            background: transparent;
            text-align: center;
            outline: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: text;
            transition: background 0.2s;
        }

        .team-title-input:hover, .team-title-input:focus {
            background: rgba(128, 128, 128, 0.2);
        }

        .set-badge {
            font-size: 13px;
            font-weight: 600;
            background: rgba(0,0,0,0.08);
            padding: 2px 10px;
            border-radius: 10px;
            margin-bottom: 5px;
        }

        /* ฟอนต์ตัวเลขสกอร์ */
        .score {
            font-family: 'Outfit', sans-serif;
            font-size: 110px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 15px;
            color: inherit;
            letter-spacing: -2px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .score-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }

        .score-btn:active {
            transform: scale(0.92);
        }

        .minus-btn {
            background-color: rgba(0, 0, 0, 0.08);
            color: inherit;
            font-size: 26px;
        }

        /* แถบควบคุมด้านล่าง (Glassmorphism) */
        .control-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 18px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
            z-index: 999;
        }

        .dock-btn {
            background: rgba(0,0,0,0.06);
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s, transform 0.1s;
        }

        .dock-btn:hover {
            background: rgba(0,0,0,0.1);
        }

        .dock-btn:active {
            transform: scale(0.95);
        }

        .reset-dock-btn {
            background-color: #ff3b30;
            color: white;
        }

        .queue-dock-btn {
            background-color: #34c759;
            color: white;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: #444;
        }

        .color-input {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        .color-input::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-input::-webkit-color-swatch {
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .settings-select {
            background: rgba(0, 0, 0, 0.06);
            border: none;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-select:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        /* Modal หน้าต่างกลางหน้าจอ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: white;
            padding: 25px;
            border-radius: 24px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h2 {
            margin-bottom: 12px;
            font-size: 18px;
            color: #333;
        }

        .modal-card select, .modal-card textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }

        .modal-card textarea {
            height: 80px;
            resize: none;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .label-row span {
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .clear-text-btn {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .clear-text-btn:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        /* ตารางอันดับ */
        .leaderboard-list {
            background: #f9f9fb;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            text-align
