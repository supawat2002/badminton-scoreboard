<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Queue & Score Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f7;
            overflow: hidden;
            position: relative;
        }

        .top-right-btns {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .floating-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .floating-btn:hover { background: rgba(255, 255, 255, 0.85); }
        .floating-btn:active { transform: scale(0.92); }

        .deuce-toast {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 3000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .deuce-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .team-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 10px;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .team-1 { background-color: #e3f2fd; color: #222; border-bottom: 2px solid rgba(255,255,255,0.5); }
        .team-2 { background-color: #fbe9e7; color: #222; }

        .team-title-input {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
            color: inherit;
            text-transform: uppercase;
            border: none;
            background: transparent;
            text-align: center;
            outline: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: text;
        }

        .set-badge {
            font-size: 13px;
            font-weight: 600;
            background: rgba(0,0,0,0.08);
            padding: 2px 10px;
            border-radius: 10px;
            margin-bottom: 5px;
        }

        .score {
            font-family: 'Outfit', sans-serif;
            font-size: 110px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 15px;
            color: inherit;
            letter-spacing: -2px;
        }

        .btn-group { display: flex; gap: 15px; }
        .score-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            font-size: 22px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .minus-btn { background-color: rgba(0, 0, 0, 0.08); color: inherit; font-size: 26px; }

        .control-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(15px);
            display: flex; gap: 8px; align-items: center; padding: 10px 18px;
            border-radius: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 1px solid rgba(255, 255, 255, 0.8); z-index: 999;
        }

        .dock-btn {
            background: rgba(0,0,0,0.06); border: none; padding: 7px 14px;
            border-radius: 20px; font-size: 12px; font-weight: 600; color: #333; cursor: pointer;
        }
        .reset-dock-btn { background-color: #ff3b30; color: white; }
        .queue-dock-btn { background-color: #34c759; color: white; }

        .color-picker-wrapper { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #444; }
        .color-input { appearance: none; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; background: transparent; }
        .settings-select { background: rgba(0,0,0,0.06); border: none; padding: 7px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #333; outline: none; cursor: pointer; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }

        .modal-card {
            background: white; padding: 25px; border-radius: 24px;
            width: 90%; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center; max-height: 90vh; overflow-y: auto;
        }

        .modal-card h2 { margin-bottom: 12px; font-size: 18px; color: #333; }
        .modal-card select, .modal-card textarea {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ddd; font-size: 14px; background: #fafafa;
        }
        .modal-card textarea { height: 80px; resize: none; }

        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .label-row span { font-size: 12px; font-weight: 600; color: #666; }
        .clear-text-btn { background: none; border: none; color: #ff3b30; font-size: 12px; font-weight: 600; cursor: pointer; padding: 2px 6px; }

        /* --- สไตล์หน้าต่างทำเนียบแชมป์ (ปรับแต่งรูปให้พอดีกรอบ และเอาป้ายชื่อไว้บนหัวเป๊ะๆ) --- */
        .cloud-modal-card {
            background: #111318 !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 215, 0, 0.15);
        }

        .cloud-modal-card h2 {
            color: #ffd700 !important;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .image-podium-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin: 15px 0;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-podium-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ปรับขนาดรูปให้เข้ากับกรอบพอดี ไม่โดนตัดขอบ */
        }

        .overlay-card {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            padding: 4px 8px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 2;
            max-width: 100px;
        }

        .overlay-name {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .overlay-sets {
            font-size: 9px;
            font-weight: 700;
            color: #38ef7d;
        }

        /* --- พิกัดป้ายชื่อขึ้นไปอยู่บนหัวตัวละครแต่ละคน --- */
        .overlay-rank-1 { top: 2%; left: 50%; transform: translateX(-50%); border-color: #ffd700; }
        .overlay-rank-1 .overlay-name { color: #ffd700; }

        .overlay-rank-2 { top: 12%; left: 24%; transform: translateX(-50%); border-color: #c0c0c0; }
        .overlay-rank-2 .overlay-name { color: #c0c0c0; }

        .overlay-rank-3 { top: 15%; left: 76%; transform: translateX(-50%); border-color: #cd7f32; }
        .overlay-rank-3 .overlay-name { color: #cd7f32; }

        .leaderboard-list {
            background: #1a1d24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 8px;
            margin-bottom: 15px;
            max-height: 140px;
            overflow-y: auto;
            text-align: left;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
        }

        .leaderboard-item:last-child { border-bottom: none; }
        .leaderboard-rank { font-weight: 700; color: #aaa; width: 30px; }
        .leaderboard-name { flex: 1; font-weight: 600; color: #fff; }
        .leaderboard-score { font-weight: 700; color: #38ef7d; font-size: 12px; }

        .history-tags-container {
            display: flex; gap: 6px; flex-wrap: wrap; max-height: 70px;
            overflow-y: auto; margin-bottom: 12px; padding: 4px; background: #f4f4f6; border-radius: 10px; text-align: left;
        }
        .history-tag {
            background: #ffffff; border: 1px solid #ddd; padding: 4px 10px;
            border-radius: 15px; font-size: 11px; font-weight: 600; color: #333; cursor: pointer;
        }

        .queue-status { background: #f0f0f5; padding: 10px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; text-align: left; color: #444; }
        .modal-btn-group { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-confirm { background: #007aff; color: white; }
        .btn-cancel { background: #2a2f3d; color: #fff; }
    </style>
</head>
<body>

    <div class="top-right-btns">
        <div class="floating-btn" onclick="openLocalRankModal()" title="แรงค์ก๊วนเราเอง">📊</div>
        <div class="floating-btn" onclick="openCloudRankModal()" title="ทำเนียบแชมป์โลก (Cloud)">🏆</div>
    </div>

    <div class="deuce-toast" id="deuceToast">DEUCE!</div>

    <div class="team-container team-1" id="container1" onclick="handleAreaClick(1)">
        <input type="text" class="team-title-input" id="name1" value="TEAM A" onclick="event.stopPropagation()">
        <div class="set-badge" id="sets1">Win Sets: 0</div>
        <div class="score" id="score1">0</div>
        <div class="btn-group">
            <button class="score-btn minus-btn" onclick="event.stopPropagation(); updateScore(1, -1)">-</button>
        </div>
    </div>

    <div class="team-container team-2" id="container2" onclick="handleAreaClick(2)">
        <input type="text" class="team-title-input" id="name2" value="TEAM B" onclick="event.stopPropagation()">
        <div class="set-badge" id="sets2">Win Sets: 0</div>
        <div class="score" id="score2">0</div>
        <div class="btn-group">
            <button class="score-btn minus-btn" onclick="event.stopPropagation(); updateScore(2, -1)">-</button>
        </div>
    </div>

    <div class="control-dock" onclick="event.stopPropagation()">
        <button class="dock-btn reset-dock-btn" onclick="resetMatch()">🔄 รีเซ็ต</button>
        <button class="dock-btn queue-dock-btn" onclick="openModal()">👥 สุ่มจับคู่คิว</button>

        <div class="color-picker-wrapper">
            <select class="settings-select" id="maxScoreSelect" onchange="changeMaxScore(this.value)">
                <option value="7">🎯 7 แต้ม</option>
                <option value="11">🎯 11 แต้ม</option>
                <option value="15">🎯 15 แต้ม</option>
                <option value="21" selected>🎯 21 แต้ม</option>
            </select>
        </div>
        <div class="color-picker-wrapper">
            <span>ทีม1:</span><input type="color" class="color-input" value="#e3f2fd" oninput="changeTeamStyle(1, this.value)">
        </div>
        <div class="color-picker-wrapper">
            <span>ทีม2:</span><input type="color" class="color-input" value="#fbe9e7" oninput="changeTeamStyle(2, this.value)">
        </div>
    </div>

    <div class="modal-overlay" id="randomModal" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>🎲 สุ่มจับคู่และจัดคิวแบดมินตัน</h2>
            <select id="matchType">
                <option value="1">เดี่ยว (1 vs 1) - ใช้ 2 คน</option>
                <option value="2" selected>คู่ (2 vs 2) - ใช้ 4 คนขึ้นไป</option>
                <option value="3">ทีมละ 3 คน (3 vs 3) - ใช้ 6 คนขึ้นไป</option>
            </select>
            <div class="label-row">
                <span>ประวัติรายชื่อเพื่อน (คลิกเพื่อเพิ่ม):</span>
                <button class="clear-text-btn" onclick="clearAllHistory()">🗑️ ล้างประวัติ</button>
            </div>
            <div class="history-tags-container" id="historyTagsContainer"></div>
            <div class="label-row" style="margin-top: 8px;">
                <span>พิมพ์รายชื่อเพื่อน:</span>
                <button class="clear-text-btn" onclick="clearPlayerInput()">🗑️ ล้างช่องพิมพ์</button>
            </div>
            <textarea id="playerNames" placeholder="พิมพ์รายชื่อเพื่อนทั้งหมด บรรทัดละ 1 คน"></textarea>
            <div class="queue-status" id="queueStatusText">คิวที่รออยู่: ยังไม่มีข้อมูล</div>
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="closeModal()">ปิด</button>
                <button class="modal-btn btn-confirm" onclick="setupQueueAndPlay()">สุ่มรายชื่อลงสนาม</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="localRankModal" onclick="closeLocalRankModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>📊 ตารางแรงค์ (เฉพาะก๊วนเรา)</h2>
            <div class="leaderboard-list" id="localLeaderboardListContainer"></div>
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="closeLocalRankModal()">ปิด</button>
                <button class="modal-btn btn-confirm" style="background-color: #ff3b30;" onclick="resetLocalLeaderboard()">รีเซ็ตสถิติก๊วนเรา</button>
            </div>
        </div>
    </div>

    <!-- หน้าต่างทำเนียบแชมป์โลก -->
    <div class="modal-overlay" id="cloudRankModal" onclick="closeCloudRankModal()">
        <div class="modal-card cloud-modal-card" onclick="event.stopPropagation()">
            <h2>🏆 ทำเนียบแชมป์โลก (Podium)</h2>
            <p style="font-size: 11px; color: #888; margin-bottom: 5px;">สถิติสูงสุดจากระบบกลาง</p>
            
            <div class="image-podium-wrapper" id="imagePodiumContainer">
                <!-- โหลดรูปโพเดียมจาก Discord -->
            </div>

            <div class="leaderboard-list" id="cloudLeaderboardListContainer"></div>

            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="closeCloudRankModal()">ปิด</button>
                <button class="modal-btn btn-confirm" style="background-color: #ff3b30;" onclick="resetCloudLeaderboardSecure()">รีเซ็ตคลาวด์กลาง</button>
            </div>
        </div>
    </div>

    <script>
        let score1 = 0, score2 = 0, sets1 = 0, sets2 = 0, maxScore = 21, absoluteMaxScore = 30;
        let waitingQueue = [], activePlayersTeam1 = [], activePlayersTeam2 = [], currentMatchType = 2;
        let savedPlayerHistory = JSON.parse(localStorage.getItem('badminton_history') || '[]');
        let playerWins = JSON.parse(localStorage.getItem('badminton_wins') || '{}');
        let lastDeuceState = false;
        const ADMIN_PIN = "1234";

        function saveToLocal() {
            localStorage.setItem('badminton_history', JSON.stringify(savedPlayerHistory));
            localStorage.setItem('badminton_wins', JSON.stringify(playerWins));
        }

        function openModal() { document.getElementById('randomModal').style.display = 'flex'; renderHistoryTags(); updateQueueStatusUI(); }
        function closeModal() { document.getElementById('randomModal').style.display = 'none'; }
        function openLocalRankModal() { document.getElementById('localRankModal').style.display = 'flex'; renderLocalLeaderboard(); }
        function closeLocalRankModal() { document.getElementById('localRankModal').style.display = 'none'; }
        
        function openCloudRankModal() {
            document.getElementById('cloudRankModal').style.display = 'flex';
            if (typeof fetchCloudLeaderboard === 'function') fetchCloudLeaderboard();
        }
        function closeCloudRankModal() {
            document.getElementById('cloudRankModal').style.display = 'none';
        }

        function showDeuceToast() {
            let toast = document.getElementById('deuceToast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        function clearPlayerInput() { document.getElementById('playerNames').value = ''; document.getElementById('playerNames').focus(); }
        function appendPlayerName(name) {
            let textarea = document.getElementById('playerNames');
            let currentText = textarea.value.trim();
            if (currentText === "") textarea.value = name;
            else {
                let lines = currentText.split('\n').map(p => p.trim());
                if (!lines.includes(name)) textarea.value = currentText + '\n' + name;
            }
        }

        function handleAreaClick(team) { updateScore(team, 1); }
        function updateScore(team, value) {
            if (team === 1) { score1 += value; if (score1 < 0) score1 = 0; document.getElementById('score1').innerText = score1; }
            else if (team === 2) { score2 += value; if (score2 < 0) score2 = 0; document.getElementById('score2').innerText = score2; }
            checkDeuce(); checkWin();
        }

        function checkDeuce() {
            let deuceThreshold = maxScore - 1;
            let isCurrentlyDeuce = (score1 >= deuceThreshold && score2 >= deuceThreshold && score1 === score2);
            if (isCurrentlyDeuce && !lastDeuceState) showDeuceToast();
            lastDeuceState = isCurrentlyDeuce;
        }

        function changeMaxScore(val) {
            maxScore = parseInt(val);
            if (maxScore === 7) absoluteMaxScore = 9;
            else if (maxScore === 11) absoluteMaxScore = 15;
            else if (maxScore === 15) absoluteMaxScore = 21;
            else absoluteMaxScore = 30;
            resetScore();
        }

        function resetScore() { score1 = 0; score2 = 0; lastDeuceState = false; document.getElementById('score1').innerText = score1; document.getElementById('score2').innerText = score2; }
        function resetMatch() {
            if (confirm('ต้องการรีเซ็ตคะแนนและจำนวนเซตทั้งหมดหรือไม่?')) {
                sets1 = 0; sets2 = 0;
                document.getElementById('sets1').innerText = "Win Sets: 0";
                document.getElementById('sets2').innerText = "Win Sets: 0";
                resetScore();
            }
        }

        function updateTeamNamesUI() {
            if (activePlayersTeam1.length > 0) {
                document.getElementById('name1').value = activePlayersTeam1.join(' & ');
                document.getElementById('name2').value = activePlayersTeam2.join(' & ');
            }
        }

        function rotateQueue(loserTeam) {
            if (waitingQueue.length === 0) { alert('⚠️ ไม่มีเพื่อนรอคิวอยู่แล้วครับ!'); return; }
            let outgoingPlayers = loserTeam === 1 ? activePlayersTeam1 : activePlayersTeam2;
            waitingQueue.push(...outgoingPlayers);
            let incomingCount = currentMatchType === 1 ? 1 : (currentMatchType === 2 ? 2 : 3);
            let newPlayers = waitingQueue.splice(0, incomingCount);
            if (loserTeam === 1) activePlayersTeam1 = newPlayers; else activePlayersTeam2 = newPlayers;
            updateTeamNamesUI(); resetScore(); alert('🔄 หมุนเวียนคิวเรียบร้อย!');
        }

        function changeTeamStyle(team, color) {
            const container = document.getElementById(team === 1 ? 'container1' : 'container2');
            container.style.backgroundColor = color;
            const r = parseInt(color.substr(1, 2), 16), g = parseInt(color.substr(3, 2), 16), b = parseInt(color.substr(5, 2), 16);
            container.style.color = ((r * 299 + g * 587 + b * 114) / 1000) < 128 ? '#ffffff' : '#111111';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function setupQueueAndPlay() {
            let rawText = document.getElementById('playerNames').value.trim();
            let players = rawText.split('\n').map(p => p.trim()).filter(p => p.length > 0);
            currentMatchType = parseInt(document.getElementById('matchType').value);
            let requiredCount = currentMatchType === 1 ? 2 : (currentMatchType === 2 ? 4 : 6);
            if (players.length < requiredCount) { alert(`โหมดนี้ต้องใช้ผู้เล่นอย่างน้อย ${requiredCount} คนครับ!`); return; }

            players.forEach(name => {
                if (!savedPlayerHistory.includes(name)) savedPlayerHistory.push(name);
                if (!(name in playerWins)) playerWins[name] = 0;
            });
            saveToLocal();

            let shuffledPlayers = shuffleArray([...players]);
            let activePool = shuffledPlayers.splice(0, requiredCount);
            waitingQueue = shuffledPlayers;

            if (currentMatchType === 2) {
                activePlayersTeam1 = [activePool[0], activePool[1]];
                activePlayersTeam2 = [activePool[2], activePool[3]];
            } else if (currentMatchType === 3) {
                activePlayersTeam1 = [activePool[0], activePool[1], activePool[2]];
                activePlayersTeam2 = [activePool[3], activePool[4], activePool[5]];
            } else {
                activePlayersTeam1 = [activePool[0]];
                activePlayersTeam2 = [activePool[1]];
            }

            updateTeamNamesUI(); closeModal(); resetMatch(); updateQueueStatusUI(); alert('🎲 สุ่มจับคู่รายชื่อลงสนามเรียบร้อย!');
        }

        function checkWin() {
            let diff = Math.abs(score1 - score2);
            let hasWon = (score1 >= maxScore || score2 >= maxScore) && (diff >= 2 || score1 >= absoluteMaxScore || score2 >= absoluteMaxScore);

            if (hasWon) {
                let team1Name = document.getElementById('name1').value;
                let team2Name = document.getElementById('name2').value;
                if (score1 > score2) {
                    sets1++; document.getElementById('sets1').innerText = "Win Sets: " + sets1;
                    activePlayersTeam1.forEach(p => { playerWins[p] = (playerWins[p] || 0) + 1; if (!savedPlayerHistory.includes(p)) savedPlayerHistory.push(p); });
                    saveToLocal(); if (typeof autoSyncToCloud === 'function') autoSyncToCloud();
                    if (confirm(`🎉 ทีม (${team1Name}) ชนะ!\n\nให้ทีมแพ้ (${team2Name}) ลงพักแล้วดึงคิวถัดไปขึ้นมาแทนเลยไหม?`)) rotateQueue(2); else resetScore();
                } else {
                    sets2++; document.getElementById('sets2').innerText = "Win Sets: " + sets2;
                    activePlayersTeam2.forEach(p => { playerWins[p] = (playerWins[p] || 0) + 1; if (!savedPlayerHistory.includes(p)) savedPlayerHistory.push(p); });
                    saveToLocal(); if (typeof autoSyncToCloud === 'function') autoSyncToCloud();
                    if (confirm(`🎉 ทีม (${team2Name}) ชนะ!\n\nให้ทีมแพ้ (${team1Name}) ลงพักแล้วดึงคิวถัดไปขึ้นมาแทนเลยไหม?`)) rotateQueue(1); else resetScore();
                }
            }
        }

        function renderLocalLeaderboard() {
            let container = document.getElementById('localLeaderboardListContainer');
            if (!container) return;
            let sortedPlayers = [...savedPlayerHistory].sort((a, b) => (playerWins[b] || 0) - (playerWins[a] || 0));
            if (sortedPlayers.length === 0 || sortedPlayers.every(p => (playerWins[p] || 0) === 0)) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 20px; font-size: 13px;">ยังไม่มีสถิติการชนะในก๊วนเรา</div>';
                return;
            }
            let html = '';
            sortedPlayers.forEach((name, index) => {
                let wins = playerWins[name] || 0;
                let rankIcon = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : `#${index + 1}`));
                html += `<div class="leaderboard-item"><span class="leaderboard-rank">${rankIcon}</span><span class="leaderboard-name">${name}</span><span class="leaderboard-score">ชนะ ${wins} เซต</span></div>`;
            });
            container.innerHTML = html;
        }

        function resetLocalLeaderboard() {
            if (confirm('ต้องการรีเซ็ตสถิติและคะแนนทั้งหมดของก๊วนเราใช่หรือไม่?')) {
                playerWins = {}; savedPlayerHistory = []; saveToLocal(); renderLocalLeaderboard(); renderHistoryTags();
            }
        }

        function renderHistoryTags() {
            let container = document.getElementById('historyTagsContainer');
            if (!container) return;
            if (savedPlayerHistory.length === 0) { container.innerHTML = '<span style="font-size: 11px; color: #888; padding: 4px;">ยังไม่มีประวัติรายชื่อ</span>'; return; }
            container.innerHTML = savedPlayerHistory.map(name => `<div class="history-tag" onclick="appendPlayerName('${name}')">+ ${name}</div>`).join('');
        }

        function updateQueueStatusUI() {
            let statusDiv = document.getElementById('queueStatusText');
            if (!statusDiv) return;
            statusDiv.innerHTML = waitingQueue.length === 0 ? "<b>คิวที่รออยู่:</b> ยังไม่มีรายชื่อในระบบ" : `<b>คิวรอลงสนาม (${waitingQueue.length} คน):</b> ${waitingQueue.join(', ')}`;
        }

        function clearAllHistory() {
            if (confirm('ต้องการล้างประวัติรายชื่อทั้งหมดหรือไม่?')) { savedPlayerHistory = []; playerWins = {}; saveToLocal(); renderHistoryTags(); }
        }
    </script>

    <!-- ระบบ Cloud Firestore กลาง -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCydHu6xNL4BMJchkuOa7U1wbAoqx1obBA",
            authDomain: "badminton-scoreboard-9a3e9.firebaseapp.com",
            projectId: "badminton-scoreboard-9a3e9",
            storageBucket: "badminton-scoreboard-9a3e9.firebasestorage.app",
            messagingSenderId: "987628275399",
            appId: "1:987628275399:web:30a1a0fd83a2b0d65a60e2",
            measurementId: "G-GY7LTREQEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rankDocRef = doc(db, "badminton_data", "leaderboard_room");

        const discordImageUrl = "https://media.discordapp.net/attachments/1193954420044595220/1561103511016575016/podium.png.png?ex=6ad52270&is=6ad3d0f0&hm=33cecb6ad53ec505528e3e4047670eb9fcf73c63786ad98dd99fd5b020db7612&=&format=webp&quality=lossless&width=1024&height=1024";

        window.fetchCloudLeaderboard = async function() {
            let containerWrapper = document.getElementById('imagePodiumContainer');
            let listContainer = document.getElementById('cloudLeaderboardListContainer');
            listContainer.innerHTML = '';

            try {
                let docSnap = await getDoc(rankDocRef);
                
                let imageHtml = `<img src="${discordImageUrl}" alt="Podium">`;

                if (docSnap.exists()) {
                    let data = docSnap.data();
                    let cloudWins = data.wins || {};
                    let cloudHistory = data.history || [];
                    let sortedPlayers = [...cloudHistory].sort((a, b) => (cloudWins[b] || 0) - (cloudWins[a] || 0));

                    let top1 = sortedPlayers[0] ? { name: sortedPlayers[0], wins: cloudWins[sortedPlayers[0]] || 0 } : null;
                    let top2 = sortedPlayers[1] ? { name: sortedPlayers[1], wins: cloudWins[sortedPlayers[1]] || 0 } : null;
                    let top3 = sortedPlayers[2] ? { name: sortedPlayers[2], wins: cloudWins[sortedPlayers[2]] || 0 } : null;

                    if (top1) {
                        imageHtml += `
                            <div class="overlay-card overlay-rank-1">
                                <div class="overlay-name">👑 ${top1.name}</div>
                                <div class="overlay-sets">ชนะ ${top1.wins} เซต</div>
                            </div>
                        `;
                    }
                    if (top2) {
                        imageHtml += `
                            <div class="overlay-card overlay-rank-2">
                                <div class="overlay-name">🥈 ${top2.name}</div>
                                <div class="overlay-sets">ชนะ ${top2.wins} เซต</div>
                            </div>
                        `;
                    }
                    if (top3) {
                        imageHtml += `
                            <div class="overlay-card overlay-rank-3">
                                <div class="overlay-name">🥉 ${top3.name}</div>
                                <div class="overlay-sets">ชนะ ${top3.wins} เซต</div>
                            </div>
                        `;
                    }

                    containerWrapper.innerHTML = imageHtml;

                    let restPlayers = sortedPlayers.slice(3);
                    if (restPlayers.length > 0) {
                        let listHtml = '';
                        restPlayers.forEach((name, index) => {
                            let wins = cloudWins[name] || 0;
                            listHtml += `<div class="leaderboard-item"><span class="leaderboard-rank">#${index + 4}</span><span class="leaderboard-name">${name}</span><span class="leaderboard-score">ชนะ ${wins} เซต</span></div>`;
                        });
                        listContainer.innerHTML = listHtml;
                    } else {
                        listContainer.innerHTML = '<div style="text-align: center; color: #777; font-size: 11px; padding: 5px;">แสดงอันดับท็อป 3 บนโพเดียมครบแล้ว</div>';
                    }
                } else {
                    containerWrapper.innerHTML = imageHtml;
                }
            } catch (e) {
                console.error("Error fetching cloud: ", e);
            }
        };

        window.autoSyncToCloud = async function() {
            try {
                let docSnap = await getDoc(rankDocRef);
                let existingWins = {}, existingHistory = [];
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    existingWins = data.wins || {};
                    existingHistory = data.history || [];
                }
                for (let name in playerWins) {
                    existingWins[name] = Math.max(existingWins[name] || 0, playerWins[name]);
                    if (!existingHistory.includes(name)) existingHistory.push(name);
                }
                await setDoc(rankDocRef, { wins: existingWins, history: existingHistory }, { merge: true });
            } catch (e) { console.error("Auto sync error: ", e); }
        };

        window.resetCloudLeaderboardSecure = async function() {
            let pin = prompt("กรุณาใส่รหัสผ่านแอดมิน (PIN 4 ตัว) เพื่อรีเซ็ตคลาวด์กลาง:");
            if (pin === ADMIN_PIN) {
                if (confirm('ยืนยันการล้างสถิติตารางแชมป์โลกทั้งหมดบนคลาวด์กลางหรือไม่?')) {
                    try {
                        await setDoc(rankDocRef, { wins: {}, history: [] });
                        fetchCloudLeaderboard();
                        alert('🗑️ ล้างสถิติคลาวด์กลางเรียบร้อย!');
                    } catch (e) { alert('❌ ไม่สามารถรีเซ็ตได้'); }
                }
            } else if (pin !== null) { alert("❌ รหัสผ่านไม่ถูกต้อง!"); }
        };
    </script>
